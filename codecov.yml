codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes
coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: 80%
        threshold: 2%
        base: auto
        if_ci_failed: error
    patch:
      default:
        target: 80%
        threshold: 5%
        base: auto
        if_ci_failed: error
  parsers:
    gcov:
      branch_detection:
        conditional: yes
        loop: yes
        method: no
        macro: no
comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: no
ignore: ["tests/", "docs/", "*.md", "setup.py"]
flags:
  unittests:
    paths: [prediction_engine.py, premium_engine.py, severity_model.py]
    carryforward: false
  nightly:
    paths: [.]
    carryforward: true
